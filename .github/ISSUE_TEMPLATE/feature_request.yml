name: Feature request
description: Suggest a new check, rule or cleaning action
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What data problem are you trying to solve?
      description: A concrete example helps most.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like cleanplan to do?
