name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }}, ${{ matrix.deps }} deps)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        deps: [latest]
        include:
          # Oldest supported pandas and numpy. A distinct "deps" value makes this
          # a separate job instead of being merged into the 3.11 one.
          - os: ubuntu-latest
            python-version: "3.11"
            deps: minimum
            pins: "'pandas==2.0.3' 'numpy<2'"
          - os: windows-latest
            python-version: "3.12"
            deps: latest
          - os: macos-latest
            python-version: "3.12"
            deps: latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" ${{ matrix.pins }}
      - run: python -c "import pandas, numpy; print('pandas', pandas.__version__, 'numpy', numpy.__version__)"
      - run: pytest --cov=cleanplan --cov-report=term-missing
